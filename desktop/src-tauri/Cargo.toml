[package]
name = "orven-desktop"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
audit-core = { path = "../../crates/audit-core" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "=2.7.2"
reqwest = { version = "=0.13.3", default-features = false, features = ["blocking", "json", "native-tls"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
tempfile = "3"
git2 = { version = "0.21", default-features = false }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
